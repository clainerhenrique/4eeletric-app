<script>
(function(){if(window.claude)return;
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]);f.readAsDataURL(b)});
window.claude={use:async()=>({save:async({filename,data})=>{
const C=window.Capacitor;
if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Filesystem){
const r=await C.Plugins.Filesystem.writeFile({path:filename,data:await b64(data),directory:'CACHE'});
await C.Plugins.Share.share({title:filename,url:r.uri,dialogTitle:'Salvar ou enviar PDF'});return}
const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();
setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}})}})();
</script>

{id:'50e',brand:'Samsung',model:'INR21700-50E',chem:'NMC',form:'Cilíndrica',v:3.6,vmin:2.5,vmax:4.2,ah:5,ic:9.8,ip:15,w:69,r:22,d:[21.7,21.7,70.4]},

{id:'lto30',brand:'Genérica',model:'LTO 2,3V 30Ah',chem:'LTO',form:'Prismática',v:2.3,vmin:1.5,vmax:2.8,ah:30,ic:150,ip:300,w:950,r:1,d:[25,115,180]},
{id:'na18650',brand:'Genérica',model:'Na-ion 18650',chem:'Sódio-íon',form:'Cilíndrica',v:3,vmin:1.5,vmax:3.95,ah:1.5,ic:4.5,ip:7.5,w:35,r:20,d:[18.4,18.4,65]},
{id:'pouch10',brand:'Genérica',model:'Pouch NMC 10Ah',chem:'NMC',form:'Pouch',v:3.7,vmin:3,vmax:4.2,ah:10,ic:30,ip:60,w:200,r:6,d:[7,80,120]}];
const PR={custom:['Personalizado'],pat:['Patinete elétrico',36,350,700,1.5],bike:['Bicicleta elétrica',36,250,500,2],sco:['Scooter elétrica',60,1500,3000,2],moto:['Moto elétrica',72,5000,10000,1],sol:['Sistema solar',48,1000,2000,5],nob:['Nobreak',48,600,1200,3],fer:['Ferramenta elétrica',20,400,1200,.5],ind:['Equipamento industrial',48,3000,6000,4]};
const BMS=[10,15,20,30,40,50,60,80,100,120,150,200,250,300,400],FUSE=[10,15,20,25,30,40,50,63,80,100,125,150,200,250,300,400,500];
const CAB=[[1.5,18],[2.5,25],[4,34],[6,43],[10,60],[16,80],[25,105],[35,130],[50,165],[70,205],[95,250],[120,290]];
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let custom=ld('4e_cells',[]),projs=ld('4e_projs',[]),cmp=[];const sb0=ld('4e_b',null);if(Array.isArray(sb0))CELLS.splice(0,CELLS.length,...sb0);
let S={tab:'pack',name:'Meu pack',cell:'eve25p',mode:'auto',tv:36,tah:10,s:10,p:4,pw:500,pk:900,len:0.5,chg:0.5,dod:90,eff:85,prof:'custom',h:2,f:'Todas',ls:10,lp:4,lm:0,bx:200,by:150,bz:80,lay:0,oc:0,ob:0,om:0,oo:0,ot:0,mg:0,cli:'',tec:'Clainer Henrique',ed:null,dcli:'',dbat:'',ddt:new Date().toISOString().slice(0,10),dsv:'',drel:''};
const $=s=>document.querySelector(s),all=()=>CELLS.concat(custom),cell=()=>all().find(c=>c.id===S.cell)||all()[0];
const n=(x,d=1)=>(+x).toLocaleString('pt-BR',{maximumFractionDigits:d}),T=(l,v)=>`<div class="t"><small>${l}</small><b>${v}</b></div>`;
const chk=(o,t)=>`<div class="ck ${o?'ok':'no'}">${o?'✔':'⚠'} ${t}</div>`;
const F=(k,l,u)=>`<label>${l}${u?' ('+u+')':''}<input type="number" inputmode="decimal" step="any" data-k="${k}" value="${S[k]}"></label>`;
const nm=()=>`<label>Nome do projeto<input type="text" data-k="name" value="${S.name.replace(/"/g,'&quot;')}"></label>`;
function calc(c,s,p){const N=s*p;return{s,p,N,V:s*c.v,Vmin:s*c.vmin,Vmax:s*c.vmax,Ah:p*c.ah,Wh:s*c.v*p*c.ah,kg:N*c.w*1.12/1000,Ic:p*c.ic,Ip:p*c.ip,cr:c.ic/c.ah,R:s*c.r/p*1.1+2,dm:[s*c.d[0]+4,p*c.d[1]+4,c.d[2]+4]}}
function cur(){const c=cell();let s=S.s,p=S.p;if(S.mode=='auto'){s=Math.max(1,Math.ceil(S.tv/c.v-1e-9));p=Math.max(1,Math.ceil(S.tah/c.ah-1e-9))}
s=Math.max(1,Math.round(s)||1);p=Math.max(1,Math.round(p)||1);return{c,k:calc(c,s,p)}}
function el(k){const Il=S.pw/k.V,Ip=S.pk/k.Vmin;let i=CAB.findIndex(x=>x[1]>=Il*1.25);if(i<0)i=CAB.length-1;const dr=j=>Il*.0172*2*S.len/CAB[j][0];while(i<CAB.length-1&&dr(i)/k.V>.02)i++;
const sag=Il*k.R/1000;return{Il,Ip,A:CAB[i][0],drop:dr(i),fu:FUSE.find(x=>x>=Il*1.25)||500,bms:BMS.find(x=>x>=Il*1.25)||400,bw:Math.max(8,Math.ceil(Il/9)),sag,loss:Il*Il*k.R/1000}}
const cmpT=()=>cmp.length?`<div class="card"><h3>Comparação de configurações</h3><div class="tbl"><table><tr><th>Célula</th><th>Config.</th><th>V</th><th>Ah</th><th>Wh</th><th>A cont.</th><th>kg</th></tr>${cmp.map(x=>`<tr><td>${x.n}</td><td>${x.k.s}S${x.k.p}P</td><td>${n(x.k.V)}</td><td>${n(x.k.Ah)}</td><td>${n(x.k.Wh,0)}</td><td>${n(x.k.Ic)}</td><td>${n(x.k.kg,2)}</td></tr>`).join('')}</table></div><button class="b2" onclick="cmp=[];upd()">Limpar comparação</button></div>`:'';
const rPack=()=>{const{c,k}=cur();return`<div class="card"><div class="g">${T('Configuração',k.s+'S'+k.p+'P')}${T('Total de células',k.N)}${T('Tensão nominal',n(k.V)+' V')}${T('Mín / máx',n(k.Vmin)+' / '+n(k.Vmax)+' V')}${T('Capacidade',n(k.Ah)+' Ah')}${T('Energia',k.Wh>=1000?n(k.Wh/1000,2)+' kWh':n(k.Wh,0)+' Wh')}${T('Corrente contínua',n(k.Ic)+' A')}${T('Corrente de pico',n(k.Ip)+' A')}${T('C-rate contínuo',n(k.Ic/k.Ah,2)+'C')}${T('Peso estimado',n(k.kg,2)+' kg')}${T('Dimensões (mm)',k.dm.map(x=>n(x,0)).join(' × '))}${T('Resistência interna',n(k.R,0)+' mΩ')}</div><button class="btn" onclick="addCmp()">Adicionar à comparação</button><button class="b2" onclick="toLay()">Ver ligação das células</button></div>${cmpT()}`};
const rEl=()=>{const{k}=cur(),e=el(k),dp=e.drop/k.V*100,sp=e.sag/k.V*100;return`<div class="card"><h3>Correntes e C-rate (${k.s}S${k.p}P)</h3><div class="g">${T('Corrente contínua da carga',n(e.Il)+' A')}${T('Corrente de pico (na tensão mín.)',n(e.Ip)+' A')}${T('C-rate de descarga',n(e.Il/k.Ah,2)+'C')}${T('C-rate de pico',n(e.Ip/k.Ah,2)+'C')}${T('Carga a '+n(S.chg,2)+'C',n(S.chg*k.Ah)+' A · '+n(1.1/S.chg,1)+' h')}${T('Corrente por célula',n(e.Il/k.p)+' A')}</div>${chk(e.Il<=k.Ic,'Corrente contínua '+(e.Il<=k.Ic?'dentro do limite do pack ('+n(k.Ic)+' A)':'acima do limite do pack ('+n(k.Ic)+' A). Aumente P.'))}${chk(e.Ip<=k.Ip,'Corrente de pico '+(e.Ip<=k.Ip?'dentro do limite ('+n(k.Ip)+' A)':'acima do limite ('+n(k.Ip)+' A). Aumente P.'))}</div>
<div class="card"><h3>Proteção e cabeamento</h3><div class="g">${T('BMS sugerido',k.s+'S · '+e.bms+' A')}${T('Fusível',e.fu+' A')}${T('Cabo de potência',n(e.A)+' mm²')}${T('Barramento (cobre)',n(e.bw,0)+' × 3 mm')}${T('Queda no cabo',n(e.drop,2)+' V ('+n(dp,1)+'%)')}${T('Perda no cabo',n(e.drop*e.Il,1)+' W')}</div>${chk(dp<=2,'Queda no cabo '+(dp<=2?'aceitável (até 2%)':'alta, reduza o comprimento'))}<div class="sp">Cabo de cobre, ida e volta, comprimento de ${n(S.len)} m, fusível a 125% da corrente contínua.</div></div>
<div class="card"><h3>Queda de tensão e perdas no pack</h3><div class="g">${T('Queda interna (sag)',n(e.sag,2)+' V ('+n(sp,1)+'%)')}${T('Calor gerado',n(e.loss,1)+' W')}${T('Eficiência de descarga',n(100-(e.loss/(S.pw||1))*100,1)+'%')}</div>${chk(sp<=8,'Queda interna '+(sp<=8?'aceitável':'alta, use mais células em paralelo ou células com menor resistência'))}</div>`};
const rApp=()=>{const{k}=cur(),u=k.Wh*S.dod/100*S.eff/100,hr=u/(S.pw||1),need=S.pw*S.h/(S.dod/100*S.eff/100);return`<div class="card"><div class="g">${T('Energia útil',n(u,0)+' Wh')}${T('Autonomia',n(hr,2)+' h ('+n(hr*60,0)+' min)')}${T('Energia p/ '+n(S.h)+' h',n(need,0)+' Wh')}${T('Capacidade p/ '+n(S.tv)+' V',n(need/(S.tv||1),1)+' Ah')}</div><button class="btn" onclick="fit()">Dimensionar pack para esta autonomia</button></div>`};
